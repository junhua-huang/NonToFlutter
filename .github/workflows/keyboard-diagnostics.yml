name: Keyboard Diagnostics
on:
  push:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard-controls:
    if: github.ref == 'refs/heads/ios' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[keyboard-diagnostics]'))
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Inspect supported keyboard controls and current preferences
        run: |
          python3 - <<'PY'
          import glob, plistlib, re, subprocess
          candidates = sorted(glob.glob('/Applications/Xcode_27*.app'), reverse=True)
          if candidates:
              subprocess.run(['sudo', 'xcode-select', '-s', candidates[0] + '/Contents/Developer'], check=True)
          commands = [
              ['xcodebuild', '-version'],
              ['xcrun', 'devicectl', '--help'],
              ['xcrun', 'devicectl', 'device', '--help'],
              ['xcrun', 'devicectl', 'device', 'settings', '--help'],
              ['xcrun', 'devicectl', 'device', 'simulate', '--help'],
              ['xcrun', 'devicectl', 'device', 'info', '--help'],
              ['xcrun', 'simctl', 'help', 'io'],
              ['xcrun', 'simctl', 'help', 'status_bar'],
          ]
          for command in commands:
              print('\nCOMMAND:', ' '.join(command), flush=True)
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout[:24000], flush=True)
              print(result.stderr[:3000], flush=True)
              print('Exit:', result.returncode, flush=True)
              if command[1:4] == ['devicectl', 'device', 'settings'] or command[1:4] == ['devicectl', 'device', 'simulate']:
                  help_text = result.stdout + result.stderr
                  section = help_text.split('SUBCOMMANDS:')[-1].split("See '")[0]
                  for child in re.findall(r'^  ([A-Za-z][A-Za-z0-9-]*) {2,}', section, re.M):
                      nested = command[:-1] + [child, '--help']
                      print('\nCOMMAND:', ' '.join(nested), flush=True)
                      detail = subprocess.run(nested, capture_output=True, text=True)
                      print(detail.stdout[:16000], detail.stderr[:2000], flush=True)
          def keyboard_values(value, path=''):
              if isinstance(value, dict):
                  for key, child in value.items():
                      keyboard_values(child, path + '/' + key)
              elif 'keyboard' in path.lower() and isinstance(value, (bool, int, float, str)):
                  print(path, repr(value), flush=True)
          for command in [
              ['defaults', 'export', 'com.apple.iphonesimulator', '-'],
              ['defaults', '-container', 'com.apple.dt.Devices', 'export', 'com.apple.dt.Devices', '-'],
          ]:
              print('\nKEYBOARD PREFERENCES:', ' '.join(command), flush=True)
              result = subprocess.run(command, capture_output=True)
              if result.returncode == 0:
                  try: keyboard_values(plistlib.loads(result.stdout))
                  except Exception as error: print(type(error).__name__, flush=True)
              else: print('Preferences unavailable:', result.returncode, flush=True)
          PY
