name: Native iPad
on:
  push:
    branches: [ios]
    paths: ['ios/**', '.github/workflows/native-ipad.yml', '.github/workflows/testflight.yml', '.github/scripts/**', '.github/appstore/**']
  pull_request:
    paths: ['ios/**', '.github/workflows/native-ipad.yml', '.github/workflows/testflight.yml', '.github/scripts/**', '.github/appstore/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad-layout:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '27'
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      IPAD_OS: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select iPad and matching Xcode
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess
          version = os.environ['IPAD_OS']
          candidates = sorted(glob.glob('/Applications/Xcode_' + version + '*.app'), reverse=True)
          if candidates:
              subprocess.run(['sudo', 'xcode-select', '-s', candidates[0] + '/Contents/Developer'], check=True)
          print(subprocess.check_output(['xcodebuild', '-version'], text=True))
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], text=True))
          pads = [d for runtime, group in devices['devices'].items() if 'iOS-' + version in runtime
                  for d in group if d['name'].startswith('iPad') and d['isAvailable']]
          if not pads:
              raise SystemExit('No matching iPad simulator available')
          large = [d for d in pads if '13-inch' in d['name'] or '12.9-inch' in d['name']]
          pad = (large or pads)[0]
          print('iPad test device:', pad['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_UDID=' + pad['udid'] + '\n')
          subprocess.run(['defaults', 'write', 'com.apple.iphonesimulator', 'ConnectHardwareKeyboard', '-bool', 'NO'], check=True)
          PY
      - name: Verify deterministic project
        run: |
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/Nonto.xcodeproj
      - name: Verify iPad Release layouts, resizing and keyboard
        run: |
          set -o pipefail
          xcodebuild -project ios/Nonto.xcodeproj -scheme Nonto -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build/IPad -resultBundlePath build/IPad.xcresult CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -only-testing:NontoTests/IPadLayoutTests -only-testing:NontoTests/CommentsTests -only-testing:NontoTests/FriendsAndMessagesTests -parallel-testing-enabled NO test | tee ipad-tests.log
      - name: Export actual iPad screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/IPad.xcresult --output-path build/IPadScreenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nonto-iPad-${{ matrix.version }}
          path: |
            build/IPadScreenshots
            ipad-tests.log
          retention-days: 14
