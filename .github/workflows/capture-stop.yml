name: Stop Stalled Store Capture
on:
  push:
    branches: [codex/store-latest-capture-20261026]
permissions:
  actions: write
jobs:
  stop:
    if: contains(github.event.head_commit.message, '[capture-stop]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the stalled capture owned by this workflow task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,urllib.request
          url='https://api.github.com/repos/junhua-huang/NonToFlutter/actions/runs/40346097965/cancel'
          request=urllib.request.Request(url,data=b'',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response: print('Capture cancellation requested:',response.status)
          PY
