name: Native iOS
on:
  push:
    branches: [ios]
    paths: ['ios/**', '.github/workflows/native-ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'cryptography>=45,<47'
      - name: Check generated project
        run: |
          python3 ios/scripts/check_compliance.py
          python3 ios/scripts/export_legal_site.py --check
          python3 -m unittest discover -s ios/scripts/tests
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/Nonto.xcodeproj
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = sorted(glob.glob('/Applications/Xcode_26*.app'), reverse=True)
          if candidates:
              subprocess.run(['sudo', 'xcode-select', '-s', candidates[0] + '/Contents/Developer'], check=True)
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          print(version)
          if int(version.split()[1].split('.')[0]) < 26:
              raise SystemExit('Liquid Glass requires Xcode 26 or newer')
          PYCODE
      - name: Select simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              data = json.load(f)
          phones = [d for runtime, group in data['devices'].items() if 'iOS-26' in runtime for d in group if d['name'].startswith('iPhone') and d['isAvailable']]
          if not phones:
              raise SystemExit('No iPhone simulator available')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_UDID=' + phones[0]['udid'] + '\n')
          PY
      - name: Build and test native app
        run: |
          set -o pipefail
          xcodebuild -project ios/Nonto.xcodeproj -scheme Nonto -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build/Native -resultBundlePath build/NontoTests.xcresult CODE_SIGNING_ALLOWED=NO test | tee build-native.log
      - name: Verify optimized Release startup, interactions and chat
        run: |
          set -o pipefail
          xcodebuild -project ios/Nonto.xcodeproj -scheme Nonto -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build/ReleaseStartup -resultBundlePath build/ReleaseStartup.xcresult CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES -only-testing:NontoTests/LayoutSnapshotTests -only-testing:NontoTests/InteractionTests -only-testing:NontoTests/ChatExperienceTests -only-testing:NontoTests/StateTests -parallel-testing-enabled NO test | tee build-release-startup.log
      - name: Build for iPhone
        run: xcodebuild -project ios/Nonto.xcodeproj -scheme Nonto -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO build
      - name: Export layout review screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/NontoTests.xcresult --output-path build/LayoutSnapshots
      - name: Upload layout review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nonto-layout-review
          path: build/LayoutSnapshots
          if-no-files-found: warn
          retention-days: 7
      - name: Capture native login screen
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess, time
          from pathlib import Path
          try:
              data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'booted', '-j'], text=True))
              booted = [d for runtime, group in data['devices'].items() if 'iOS-26' in runtime for d in group if d['state'] == 'Booted']
              udid = booted[0]['udid'] if booted else os.environ['SIMULATOR_UDID']
              if not booted:
                  subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True, timeout=120)
              subprocess.run(['xcrun', 'simctl', 'install', udid, 'build/Native/Build/Products/Debug-iphonesimulator/Nonto.app'], check=True, timeout=40)
              subprocess.run(['xcrun', 'simctl', 'terminate', udid, 'online.nonto.native'], capture_output=True, timeout=15)
              subprocess.run(['xcrun', 'simctl', 'launch', udid, 'online.nonto.native'], check=True, timeout=40)
              time.sleep(3)
              subprocess.run(['xcrun', 'simctl', 'io', udid, 'screenshot', 'build/Nonto-auth.png'], check=True, timeout=20)
          except Exception as error:
              Path('build/Nonto-screenshot-error.txt').write_text(str(error))
              raise
          PYCODE
      - name: Upload test results and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nonto-native-checks
          path: |
            build-native.log
            build-release-startup.log
            build/ReleaseStartup.xcresult
            build/Nonto-auth.png
            build/Nonto-screenshot-error.txt
            build/NontoTests.xcresult
            build/Native/Build/Products/Debug-iphonesimulator/Nonto.app
          retention-days: 7
